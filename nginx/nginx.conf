events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  # ---- HTTP redirection to HTTPS ----
  # - first we remove the http port -
  map $host $host_no_port {
    ~^(?<name>[^:]+)  $name;
    default           $host;
  }
  # - now we redirect if port 80 or 8080 to our 8443
  server {
    listen 80;
    return 301 https://$host_no_port:8443$request_uri;
  }
  # ---- The real HTTPS server ----
  server {
    listen 443 ssl;
    client_max_body_size 5m;
    
    ssl_certificate /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/privkey.key;

    location / {
      proxy_pass http://frontend:3000;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # EXCLUSIVE RULE for public api (Keeps the keyworld /api/)
    location /api/public/ {
      proxy_pass http://backend:3001; # Without the forward slash
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://backend:3001/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s; # keep long-lived socket connections alive
    }

    location /socket.io/ {
      proxy_pass http://backend:3001;

      proxy_http_version 1.1;

      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;

      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $scheme;

      # long lasting WebSockets : we prevent nginx inactivity timeouts
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /uploads/ {
      proxy_pass http://backend:3001/uploads/;
    }
  }
}