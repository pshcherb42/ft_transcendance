services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["3000:3000"]
    environment:
      PORT: 3000
    depends_on: [backend]
    env_file: .env
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["3001:3001"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
