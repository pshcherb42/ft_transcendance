services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["3000:3000"]
    environment:
      PORT: 3000
    depends_on: [backend]
    env_file: .env
    volumes:
      - ./frontend:/app/frontend # lets docker see changes in real time
      - /app/node_modules # lets use node_modules from the root

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["3001:3001"]
    depends_on: [db]
    env_file: .env
    volumes:
      - ./backend:/app/backend
      - /app/node_modules

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data # chain the volum with the inside Postgres folder

  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf # 
    depends_on: [frontend, backend]
    restart: on-failure

volumes:
  pgdata: # declare it so Docker knows that it exists
